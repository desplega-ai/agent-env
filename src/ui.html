<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>agent-env</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
:root{color-scheme:light;--ink:#20241f;--muted:#62695e;--line:#d9ded3;--paper:#f6f7f2;--green:#256941}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 ui-sans-serif,system-ui,sans-serif}main{max-width:1040px;margin:0 auto;padding:48px 24px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:40px}h1{font-size:26px;letter-spacing:-1px;margin:0}h2{font-size:18px;margin:0}.sub{color:var(--muted);font-size:13px}button,select,a{font:inherit}button,select{padding:7px 12px;border:1px solid var(--line);border-radius:7px;background:white;color:var(--ink)}button{cursor:pointer}button:hover{border-color:var(--green)}button:focus-visible,a:focus-visible{outline:3px solid #90b899;outline-offset:3px}section{border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:18px;overflow:hidden}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:20px 22px}.top>div{min-width:0;overflow-wrap:anywhere}.service>strong{min-width:0;overflow-wrap:anywhere}.badge{flex-shrink:0;font-size:12px;border-radius:99px;padding:3px 9px;background:#edf3e9;color:#286240}.badge.off{background:#f0f0ec;color:#5e6559}.services{border-top:1px solid var(--line)}.service{display:grid;grid-template-columns:140px 1fr auto;align-items:center;gap:12px;padding:12px 22px;border-bottom:1px solid #eef0e9}.service:last-child{border-bottom:0}.service a{color:var(--green);overflow-wrap:anywhere}.actions{display:flex;align-items:center;gap:8px}.hint{margin:0 22px 18px;color:var(--muted);font-size:12px}.error{color:#983c25;white-space:pre-wrap}#empty{padding:60px 20px;text-align:center;border:1px dashed var(--line);border-radius:12px}code{font:13px ui-monospace,monospace}dialog{width:min(850px,95vw);border:1px solid var(--line);border-radius:12px;padding:20px}dialog::backdrop{background:#20241f80}dialog header{margin-bottom:16px}pre{background:#181d18;color:#e5eae0;white-space:pre-wrap;overflow-wrap:anywhere;max-height:65vh;overflow:auto;border-radius:8px;padding:16px;font:12px/1.6 ui-monospace,monospace}footer{margin-top:30px;color:var(--muted);font-size:12px}@media(max-width:600px){main{padding:24px 14px}header{margin-bottom:24px}.top{padding:16px}.service{padding:12px 16px;grid-template-columns:1fr auto}.service a,.service .address{grid-row:2;grid-column:1/-1}.hint{margin-left:16px}.top .actions{flex-wrap:wrap;justify-content:flex-end}}
.brand{display:flex;align-items:center;gap:12px}.brand img{flex-shrink:0}@media(max-width:600px){main>header{flex-wrap:wrap}}
</style></head>
<body><main><header><div class="brand"><img src="/icon.svg" width="44" height="44" alt=""><div><h1>agent-env<span style="color:var(--green)">.</span></h1><div class="sub">Your development environments</div></div></div><div class="actions"><label class="sub"><input id="auto" type="checkbox"> Auto refresh</label><button id="refresh">Refresh</button></div></header>
<p id="notice" class="error" role="status"></p><div id="instances"></div><div id="empty" hidden><h2>Nothing running yet</h2><p class="sub">Start an environment from your terminal.</p><code>agent-env up</code></div><footer id="updated">Local access only</footer></main>
<dialog id="logs"><header><h2 id="log-title">Logs</h2><button id="close">Close</button></header><pre id="log-body"></pre></dialog>
<script src="/ui.js"></script></body></html>
